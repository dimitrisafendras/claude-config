# layers.conf: the layer of each skill and the skills that it calls. install.sh links it to ~/.claude/layers.conf.
# The rule: a skill calls only a skill of its own layer or of a layer below it, and no chain of calls comes back
# to its start. tests/skill-graph.sh checks this file against the skill files, and the Setup Map draws it.
# A profile has its own layers.conf for its skills.
#   1 intake       collect and rank the work; decide nothing about how to do it
#   2 dispatch     the only layer that decides the lanes, the surface and the environment
#   3 environment  make the app run and visible; no dispatch, no merge
#   4 finish       merge, deploy, verify, ship
#   5 tools        one exact job that all layers can use
#   9 view         read-only; all layers can call it, and it calls nothing but tools
# A call is an instruction to start a skill. To name a skill for the person (a "## Next" section, "the next step
# is /x") or to cite its rules is a hint, not a call: a hint can go up the layers.
# Format: <skill> <layer> [the skills that it calls]
autonomy          1  paralel
start-work        1  paralel cleanup
pr-sweep          1  paralel
paralel           2  start-web-dev start-mobile-dev merge-when-green deploy cleanup monitor
land              4  merge-when-green
merge-when-green  4
deploy            4  start-browser
ship-mod          4  merge-when-green
sync-prefs        4
cleanup           5
start-browser     5
test-in-chrome    5  start-browser
monitor           9
setup-audit       9
