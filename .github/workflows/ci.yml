name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
# One run per workflow and ref. A new push cancels the old run of a pull request.
# A push to main is never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      # Keep LF in shell files on Windows. This runs before checkout.
      - name: Keep LF line endings
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      # On Windows, ln -s makes a real link (or fails), not a copy. No variable is set on Linux.
      - name: Make real symlinks
        if: runner.os == 'Windows'
        run: echo "MSYS=winsymlinks:nativestrict" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - name: Shell syntax
        run: git ls-files -z '*.sh' | xargs -0 -r -n1 bash -n
      # shellcheck is not on the Windows image, and one OS is enough.
      - name: shellcheck
        if: runner.os == 'Linux'
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck -S warning
      - name: JSON files parse
        run: git ls-files -z '*.json' | xargs -0 -r -n1 jq empty
      - name: Skill frontmatter
        run: |
          fail=0
          for f in claude/skills/*/SKILL.md profiles/*/skills/*/SKILL.md; do
            head -1 "$f" | grep -qx -- '---' || { echo "$f: no frontmatter"; fail=1; }
            grep -q '^name: ' "$f" || { echo "$f: no name"; fail=1; }
            grep -q '^description: ' "$f" || { echo "$f: no description"; fail=1; }
          done
          exit $fail
      # Every tests/*.sh runs, except mods.sh (the mods job runs it). A new test file needs no edit here.
      - name: Shell tests
        run: |
          fail=0
          for f in tests/*.sh; do
            [ "$f" = tests/mods.sh ] && continue
            echo "::group::$f"
            bash "$f" || { echo "::error::$f failed"; fail=1; }
            echo "::endgroup::"
          done
          exit $fail
  mods:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      # `claude plugin validate` and `claude plugin test` need no sign-in and no API key.
      # The version is pinned: --strict type-checks the mods against the types of this build.
      - name: Install the Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.330
      - name: Mods validate and test
        env:
          DISABLE_AUTOUPDATER: "1"
        run: bash tests/mods.sh
